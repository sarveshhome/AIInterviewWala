apiVersion: apps/v1
kind: Deployment
metadata:
  name: aic-api
  namespace: ai-interview-coach
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aic-api
  template:
    metadata:
      labels:
        app: aic-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/aic-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: aic-config }
            - secretRef: { name: aic-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: aic-api
  namespace: ai-interview-coach
spec:
  selector:
    app: aic-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP