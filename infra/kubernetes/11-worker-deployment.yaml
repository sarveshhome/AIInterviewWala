apiVersion: apps/v1
kind: Deployment
metadata:
  name: aic-worker
  namespace: ai-interview-coach
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aic-worker
  template:
    metadata:
      labels:
        app: aic-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/aic-worker:latest
          envFrom:
            - configMapRef: { name: aic-config }
            - secretRef: { name: aic-secrets }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aic-api-hpa
  namespace: ai-interview-coach
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aic-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }